<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子剪報</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background-color: #2980b9; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>電子剪報</h2>
    <form id="clippingForm">
        <div class="form-group">
            <label for="user">User</label>
            <select id="user" name="user">
                <option value="Harry" selected>Harry</option>
                <option value="Zoe">Zoe</option>
                <option value="Ian">Ian</option>
                <option value="Chris">Chris</option>
            </select>
        </div>

        <div class="form-group">
            <label for="category">類別</label>
            <select id="category" name="category">
                <option value="AI">AI</option>
                <option value="LEGO">LEGO</option>
                <option value="發明品相關">發明品相關</option>
                <option value="新聞與生活議題">新聞與生活議題</option>
            </select>
        </div>

        <div class="form-group">
            <label for="remark">Remark (備註)</label>
            <textarea id="remark" name="remark" placeholder="請輸入備註內容..."></textarea>
        </div>

        <div class="form-group">
            <label for="link">連結</label>
            <input type="url" id="link" name="link" placeholder="https://..." required>
        </div>

        <button type="submit" id="submitBtn">發送資料</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // 已經替換為您的專屬 Google Apps Script 網頁應用程式網址
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrSETG908jLrUMdAbwwS3Wk_IFi3FWZUkA538s2H2f2O1AV173rUglD4IPr1M51QxI9Q/exec";

    const form = document.getElementById('clippingForm');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        btn.disabled = true;
        btn.innerText = "傳送中...";
        status.innerText = "";

        const formData = new FormData(form);
        const queryString = new URLSearchParams(formData).toString();

        // 使用 fetch 發送到 GAS
        fetch(`${WEB_APP_URL}?${queryString}`, {
            method: 'POST',
            mode: 'no-cors' // 避免跨網域(CORS)報錯，但無法讀取回傳內容
        })
        .then(() => {
            // 因為用了 no-cors，無論成功失敗都會走到這裡，我們直接當作成功處理
            status.style.color = "green";
            status.innerText = "✅ 提交成功！";
            form.reset();
            // 重設預設值
            document.getElementById('user').value = "Harry";
        })
        .catch(error => {
            status.style.color = "red";
            status.innerText = "❌ 發生錯誤，請檢查網路連線";
            console.error(error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "發送資料";
        });
    });
</script>

</body>
</html>
